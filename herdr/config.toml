# ~/.config/herdr/config.toml
# Opinionated herdr configuration — replaces tmux (see docs/herdr-guide.md).
# Reference: https://herdr.dev/docs/configuration/
#
# herdr's *default* keymap already matches almost all of the old tmux setup
# (pane nav = prefix+h/j/k/l, zoom = prefix+z, close_pane = prefix+x,
# tabs/workspaces = prefix+c/w/shift+n/shift+w/shift+d, goto = prefix+g,
# reload = prefix+shift+r, copy mode = vi-style out of the box), so only
# deliberate deviations are declared below: the prefix, agent cycling, worktree
# and last-pane shortcuts, indexed agent jumps, and the custom commands/plugin
# actions. Don't re-declare defaults just to look busy.
#
# Validate after editing:  herdr config check
# Apply to a running server: herdr server reload-config  (or prefix+shift+r)
#
# herdr's config.toml has no tmux-style `source-file`/include directive, so
# there is no per-machine "local.toml" layered on top of this file (unlike
# tmux/local.conf in the old setup). This file holds no secrets — it's UI and
# keybindings only — so machine-specific tweaks go directly below. If a
# machine ever needs a genuinely different profile, point HERDR_CONFIG_PATH at
# a separate file instead (see modules/local.zsh).

onboarding = false

# =============================================================================
# PREFIX  (Ctrl+a — same ergonomic choice as the old tmux config)
# =============================================================================
[keys]
prefix         = "ctrl+a"
next_agent     = "prefix+alt+j"
previous_agent = "prefix+alt+k"
open_worktree  = "prefix+shift+o"
last_pane      = "prefix+`"

[keys.indexed]
agents = "alt"

# =============================================================================
# CUSTOM COMMANDS  (no native herdr equivalent)
# =============================================================================

# Scratch terminal — was tmux `bind t display-popup -w 80% -h 70% -E
# "tmux new-session -A -s scratch"`. Nested herdr session gives the same
# attach-or-create persistence (state/history survives closing the popup).
# Control the nested session with Ctrl+b (herdr's factory-default prefix),
# not Ctrl+a — nested instances don't inherit the outer prefix override,
# so they can't collide with it. `Ctrl+b q` detaches and closes the popup.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "herdr --session scratch"
width = "80%"
height = "70%"
description = "scratch terminal"

# System monitor — was tmux `bind B display-popup -w 95% -h 95% -E "btop"`
[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "btop"
width = "95%"
height = "95%"
description = "system monitor (btop)"

# File viewer — provided by the `herdr-file-viewer` plugin (see plugins.json;
# actions are namespaced <plugin>.<action>).
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

# =============================================================================
# THEME
# auto_switch is OFF deliberately. herdr can follow the system appearance, but
# alacritty/alacritty.toml cannot — its Maple Dark/Light palettes are a manual
# comment toggle. With auto_switch on, a system appearance change repainted the
# multiplexer light while the terminal underneath stayed dark.
#
# To get real auto-switching, fix the terminal side first (two colour files plus
# `import` swapped by a switcher), then set auto_switch = true here again. The
# light_name/dark_name values below are kept ready for that.
# =============================================================================
[theme]
name = "terminal"
auto_switch = false
light_name  = "gruvbox-light"
dark_name   = "gruvbox"

# =============================================================================
# UI — tuned for running Claude Code (and friends) as visible, labeled panes
# =============================================================================
[ui]
accent                            = "green"
show_agent_labels_on_pane_borders = true
agent_panel_sort                  = "priority"
mouse_capture                     = true
# Tuned for a narrow VS Code terminal panel: distinct state glyphs instead of
# colour-only dots, and no spare rows/columns for chrome that isn't needed.
status_indicators                 = "symbols"
hide_tab_bar_when_single_tab      = true
pane_scrollbars                   = false

# One shared layout for every agent (herdr has no wildcard in rows_by_agent, but
# `rows` is the fallback for any agent without an override).
[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# =============================================================================
# NOTIFICATIONS — replaces tmux's `monitor-activity` (which only recolored the
# window list); herdr can tell you WHICH agent needs you and WHY
# =============================================================================
[ui.toast]
delivery      = "herdr"
delay_seconds = 3   # only notify if the agent is still waiting after 3s

[ui.sound]
enabled = true

# =============================================================================
# UPDATES — herdr is Homebrew-managed (`upgrade` in modules/functions.zsh), so
# the in-app version check is redundant and only logs a failure every 30 min
# when herdr.dev/Homebrew is unreachable. manifest_check stays on: it fetches
# agent-detection updates (bundled manifests still apply when offline).
# =============================================================================
[update]
version_check  = false
manifest_check = true

# =============================================================================
# SESSION — resume Claude Code (and other supported agents) in their native
# conversation after a full herdr server restart, instead of a bare shell
# =============================================================================
[session]
resume_agents_on_restore = true

# =============================================================================
# EXPERIMENTAL — allow_nested is needed for the `scratch` popup above, which
# runs a named herdr session (`herdr --session scratch`) inside itself.
#
# This is a HARD dependency, not a nicety: without it herdr's nested-launch
# guard refuses the inner session and `prefix+t` opens an empty popup with no
# error message. Being under [experimental], the key can be renamed or removed
# in any herdr release — if prefix+t ever stops working, check this first
# against `herdr --version` (key still present in the 0.9.5 config reference).
# =============================================================================
[experimental]
allow_nested = true
